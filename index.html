:root{--lar:#FFB000;--mut:#9a9a9a}*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:#fff;font-family:'Archivo',system-ui,Arial,sans-serif;overflow-x:hidden}

main{padding-bottom:96px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 22px}

.card{background:none;border:0;color:inherit;text-align:left;font:inherit;cursor:pointer;display:block;width:100%;animation:entra .5s ease both}
.card[hidden]{display:none}@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.capa{position:relative;aspect-ratio:3/2;overflow:hidden;border-radius:6px;background:#0d0d0d}
.capa img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}

.play svg{width:16px;height:16px;margin-left:3px}.play.off{background:#333}
.card:hover .capa img,.card:focus-visible .capa img{transform:scale(1.05)}.card:hover .play{transform:scale(1)}

.info{padding:14px 2px 0}.ev{font-size:21px;font-weight:700;line-height:1.2}.cl{font-size:15px;color:#cfcfcf;margin-top:4px;font-weight:500}
.cr{font-size:13px;color:var(--lar);margin-top:8px}

dialog{border:0;padding:0;background:transparent;max-width:min(1100px,94vw);width:100%;color:#fff;margin:auto}
dialog::backdrop{background:rgba(0,0,0,.88)}.pl{position:relative;padding-top:52px}

.sem{aspect-ratio:16/9;display:grid;place-items:center;background:#0b0b0b;border:1px dashed #444;border-radius:6px;color:var(--mut);text-align:center;padding:20px}
.fechar{position:absolute;top:0;right:0;background:none;border:1px solid #666;color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer}
.leg{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}.leg b{font-size:18px}.leg span{color:#cfcfcf}.leg em{color:var(--lar);font-style:normal;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
